name: Run QA Tests

on:
  push:
    branches: [ master, main ]
  pull_request_target:
    branches: [ master, main ]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Execute Pytest Suite
      env:
        WEATHERAI_API_KEY: ${{ secrets.WEATHERAI_API_KEY }}
        WAI_API_KEY: ${{ secrets.WEATHERAI_API_KEY }}
      run: |
        pytest tests/test_weatherai.py -v --html=report.html --self-contained-html
      continue-on-error: true

    - name: Prepare Public Directory
      if: always()
      run: |
        mkdir public
        cp report.html public/report.html
        echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0; url=report.html"></head><body><p>Redirecting to <a href="report.html">Test Report</a>...</p></body></html>' > public/index.html

    - name: Deploy Report to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./public
        publish_branch: gh-pages
